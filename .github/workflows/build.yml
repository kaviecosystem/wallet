name: Build Kavi Wallet APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.7'

      - name: Find the newest Kavi Wallet project
        id: proj
        run: |
          Z=$(ls -t $(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*') 2>/dev/null | head -n 1)
          if [ -n "$Z" ]; then
            echo "Using zip: $Z"
            rm -rf _project && mkdir -p _project && unzip -q -o "$Z" -d _project
            SEARCH=_project
          else
            SEARCH=.
          fi
          D=""
          for f in $(find "$SEARCH" -name settings.gradle -not -path './.git/*'); do
            d=$(dirname "$f")
            if grep -q KAVI_KEYSTORE_FILE "$d/app/build.gradle" 2>/dev/null; then D="$d"; break; fi
          done
          if [ -z "$D" ]; then
            echo "::error::Kavi Wallet project not found. Upload KaviWallet-Android.zip (the newest one) to the repository."
            find . -maxdepth 3 -not -path './.git*' | head -n 60
            exit 1
          fi
          for need in app/src/main/AndroidManifest.xml app/src/main/assets/www/index.html app/src/main/java/app/kaviwallet/MainActivity.java; do
            if [ ! -f "$D/$need" ]; then echo "::error::Missing file: $need"; exit 1; fi
          done
          if ! printf '%s' "$D" | grep -Eq '^[A-Za-z0-9_./-]+$'; then echo "::error::Unexpected project folder name"; exit 1; fi
          echo "Version: $(grep -m1 versionName "$D/app/build.gradle")"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "Project folder: $D"

      - name: Prepare signing key
        env:
          D: ${{ steps.proj.outputs.dir }}
          KS: ${{ secrets.KAVI_KEYSTORE_BASE64 }}
          KK: ${{ secrets.KAVI_KEYSTORE_KEY }}
          SP: ${{ secrets.KAVI_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KAVI_KEY_ALIAS }}
          KP: ${{ secrets.KAVI_KEY_PASSWORD }}
        run: |
          F="$RUNNER_TEMP/kavi-release.jks"
          SPT=$(printf '%s' "$SP" | tr -d '\r\n'); export SPT
          KAT=$(printf '%s' "$KA" | tr -d '\r\n ')
          [ -z "$SPT" ] && { echo "::error::Secret KAVI_KEYSTORE_PASSWORD is missing. Value: 1-KAVI_KEYSTORE_PASSWORD.txt"; exit 1; }
          [ -z "$KAT" ] && { echo "::error::Secret KAVI_KEY_ALIAS is missing. Value: 2-KAVI_KEY_ALIAS.txt"; exit 1; }
          [ -z "$KP" ] && { echo "::error::Secret KAVI_KEY_PASSWORD is missing. Value: 3-KAVI_KEY_PASSWORD.txt"; exit 1; }
          ok=""
          if [ -n "$KS" ]; then
            printf '%s' "$KS" | tr -d ' \n\r\t' | base64 -d > "$F" 2>/dev/null || true
            if [ -s "$F" ] && keytool -list -keystore "$F" -storepass:env SPT >/dev/null 2>&1; then ok="base64"; else echo "KAVI_KEYSTORE_BASE64 is incomplete or wrong, trying KAVI_KEYSTORE_KEY instead."; fi
          fi
          if [ -z "$ok" ]; then
            KKT=$(printf '%s' "$KK" | tr -d '\r\n ')
            if [ -z "$KKT" ]; then
              echo "::error::Add the secret KAVI_KEYSTORE_KEY (value: 5-KAVI_KEYSTORE_KEY.txt, 40 characters)."
              exit 1
            fi
            if [ ! -f "$D/signing/kavi-release.jks.enc" ]; then
              echo "::error::signing/kavi-release.jks.enc is missing. Upload the newest KaviWallet-Android.zip."
              exit 1
            fi
            export KKT
            if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in "$D/signing/kavi-release.jks.enc" -out "$F" -pass env:KKT 2>/dev/null; then
              echo "::error::KAVI_KEYSTORE_KEY is wrong. Copy it again from 5-KAVI_KEYSTORE_KEY.txt (exactly 40 characters)."
              exit 1
            fi
            ok="key"
          fi
          if ! keytool -list -keystore "$F" -storepass:env SPT >/dev/null 2>&1; then
            echo "::error::KAVI_KEYSTORE_PASSWORD is wrong. Copy it again from 1-KAVI_KEYSTORE_PASSWORD.txt."
            exit 1
          fi
          if ! keytool -list -keystore "$F" -storepass:env SPT -alias "$KAT" >/dev/null 2>&1; then
            echo "::error::KAVI_KEY_ALIAS is wrong. It must be exactly: the text in 2-KAVI_KEY_ALIAS.txt"
            exit 1
          fi
          echo "Signing key ready (from $ok): $(keytool -list -v -keystore "$F" -storepass:env SPT -alias "$KAT" | grep -m1 'SHA256:' | sed 's/.*SHA256: //')"
          echo "KAVI_KEYSTORE_FILE=$F" >> "$GITHUB_ENV"

      - name: Add transaction history key
        env:
          D: ${{ steps.proj.outputs.dir }}
          NK: ${{ secrets.KAVI_NODEREAL_KEY }}
        run: |
          F="$D/app/src/main/assets/www/wallet.js"
          K=$(printf '%s' "$NK" | tr -d '\r\n ' | sed 's#.*/v1/##; s#/.*##')
          if [ -z "$K" ]; then
            echo "No KAVI_NODEREAL_KEY secret: token history will show Kavi Wallet transactions only."
            exit 0
          fi
          if ! printf '%s' "$K" | grep -Eq '^[A-Za-z0-9_-]{16,64}$'; then
            echo "::error::KAVI_NODEREAL_KEY looks wrong. Paste only the key (the part after /v1/ in the NodeReal link)."
            exit 1
          fi
          if ! grep -q "nodereal:''" "$F"; then
            echo "::error::Could not find the history key slot in wallet.js. Upload the newest KaviWallet-Android.zip."
            exit 1
          fi
          sed -i "s/nodereal:''/nodereal:'$K'/" "$F"
          echo "Full transaction history is ON for all users (key ...${K: -4})."

      - name: Build signed APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          KAVI_KEYSTORE_PASSWORD: ${{ secrets.KAVI_KEYSTORE_PASSWORD }}
          KAVI_KEY_ALIAS: ${{ secrets.KAVI_KEY_ALIAS }}
          KAVI_KEY_PASSWORD: ${{ secrets.KAVI_KEY_PASSWORD }}
        run: |
          export KAVI_KEYSTORE_PASSWORD=$(printf '%s' "$KAVI_KEYSTORE_PASSWORD" | tr -d '\r\n')
          export KAVI_KEY_ALIAS=$(printf '%s' "$KAVI_KEY_ALIAS" | tr -d '\r\n ')
          export KAVI_KEY_PASSWORD=$(printf '%s' "$KAVI_KEY_PASSWORD" | tr -d '\r\n')
          gradle assembleRelease --no-daemon --stacktrace

      - name: Check APK signature
        env:
          D: ${{ steps.proj.outputs.dir }}
        run: |
          A=$(find "$D" -path '*/app/build/outputs/apk/release/*.apk' | grep -v unsigned | head -n 1)
          if [ -z "$A" ]; then
            echo "::error::No signed APK was produced. Check that KAVI_KEY_PASSWORD matches 3-KAVI_KEY_PASSWORD.txt."
            find . -name '*.apk'
            exit 1
          fi
          cp "$A" KaviWallet.apk
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -n 1)apksigner
          if [ -x "$AS" ]; then
            "$AS" verify KaviWallet.apk || { echo "::error::APK signature is invalid"; exit 1; }
            SHA=$("$AS" verify --print-certs KaviWallet.apk | grep -m1 'SHA-256' | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g;s/:$//')
            echo "APK signing key SHA-256: $SHA"
            {
              echo "### Kavi Wallet APK is ready"
              echo "Signing key: \`$SHA\`"
              echo ""
              echo "In the app, Me > App signing key must show the same start and end (99:90 ... A2:4F)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la KaviWallet.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: KaviWallet-apk
          path: KaviWallet.apk
          if-no-files-found: error
